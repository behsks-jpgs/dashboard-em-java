spring.application.name=thindesk-dashboard
server.port=${PORT:8080}

# MongoDB Atlas: defina a variavel de ambiente MONGODB_URI com a connection string do cluster
# ex.: mongodb+srv://usuario:senha@cluster0.xxxxx.mongodb.net/thindesk?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thindesk}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true

# Popula o banco com dados de exemplo quando a colecao de chamados estiver vazia
thindesk.seed.enabled=${THINDESK_SEED:true}
thindesk.zona=America/Sao_Paulo

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
